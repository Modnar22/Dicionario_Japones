<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Dicionário Pessoal (Japonês)</title>
<style>
  :root{font-family:Inter,system-ui,Segoe UI,Roboto,Arial;--gap:12px}
  body{margin:18px;background:#0f1724;color:#e6eef8}
  .app{max-width:980px;margin:0 auto;padding:20px;background:#0b1220;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.6)}
  h1{margin:0 0 8px;font-size:20px}
  form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px}
  input,select,textarea{padding:8px;border-radius:8px;border:1px solid #1f2937;background:#081123;color:#e6eef8;outline:none}
  textarea{grid-column:1/-1;min-height:56px;resize:vertical}
  .controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  button{background:#1f6feb;border:none;padding:8px 12px;border-radius:8px;color:white;cursor:pointer}
  button.tertiary{background:#1f2937}
  .list{margin-top:10px;display:grid;gap:8px}
  .card{padding:12px;border-radius:10px;background:linear-gradient(180deg,#071127,#081420);border:1px solid #122033;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .left{display:flex;gap:12px;align-items:center}
  .word{font-size:20px;font-weight:700}
  .reading{opacity:.8;font-size:14px}
  .meta{font-size:13px;color:#b9c6d8}
  .actions{display:flex;gap:8px;align-items:center}
  .tag{padding:3px 8px;border-radius:999px;background:#0b6b3b;color:#dff7e3;font-size:12px}
  .small{font-size:12px;color:#9fb0c9}
  .searchRow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  input[type="file"]{display:none}
  .level{padding:4px 8px;border-radius:6px;background:#17233a;font-weight:600}
  .newBadge{margin-left:6px}
  .empty{padding:18px;text-align:center;color:#9fb0c9}
  @media (max-width:520px){form{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app" role="application" aria-label="Dicionário Pessoal Japonês">
  <h1>Meu Dicionário — Japonês ✨</h1>
  <p class="small">Adicione palavras em hiragana/kanji, leitura, tradução e nível JLPT. As entradas novas ganham ✨.</p>

  <form id="addForm" onsubmit="event.preventDefault(); addWord();">
    <input id="word" placeholder="Palavra (ex: いぬ / 犬)" required />
    <input id="reading" placeholder="Leitura (ex: いぬ)" />
    <input id="translation" placeholder="Tradução (ex: cachorro)" required />
    <select id="level">
      <option value="">Nível JLPT (opcional)</option>
      <option value="N5">JLPT N5</option>
      <option value="N4">JLPT N4</option>
      <option value="N3">JLPT N3</option>
      <option value="N2">JLPT N2</option>
      <option value="N1">JLPT N1</option>
    </select>
    <input id="tags" placeholder="Tags (vírgula separadas)" />
    <textarea id="notes" placeholder="Notas (ex: exemplo de frase)"></textarea>
    <div style="grid-column:1/-1;display:flex;gap:8px">
      <button type="submit">➕ Adicionar palavra</button>
      <button type="button" class="tertiary" onclick="clearForm()">Limpar formulário</button>
      <button type="button" class="tertiary" onclick="exportJSON()">Exportar JSON</button>
      <label class="tertiary" style="cursor:pointer;padding:8px;border-radius:8px;background:#243243">
        Importar JSON
        <input type="file" id="importFile" accept="application/json" onchange="importJSON(event)" />
      </label>
      <button type="button" class="tertiary" onclick="confirmClearDB()">Limpar Tudo</button>
    </div>
  </form>

  <div class="searchRow">
    <input id="q" placeholder="Buscar palavra, tradução, tag..." oninput="renderList()" style="flex:1" />
    <select id="filterLevel" onchange="renderList()">
      <option value="">Filtrar por nível</option>
      <option value="N5">N5</option>
      <option value="N4">N4</option>
      <option value="N3">N3</option>
      <option value="N2">N2</option>
      <option value="N1">N1</option>
    </select>
    <select id="sortBy" onchange="renderList()">
      <option value="createdDesc">Ordenar: Mais recentes</option>
      <option value="createdAsc">Mais antigos</option>
      <option value="wordAsc">Palavra A→Z</option>
      <option value="wordDesc">Palavra Z→A</option>
    </select>
  </div>

  <div id="list" class="list" aria-live="polite"></div>
  <div id="empty" class="empty" hidden>Seu dicionário está vazio. Adicione palavras acima.</div>
</div>

<script>
/* ====== Modelo de dados ======
entry = {
  id: string,
  word: string,
  reading: string,
  translation: string,
  level: string (N5..N1 | ""),
  tags: [string],
  notes: string,
  createdAt: timestamp,
  seen: boolean  // usado para marcar que não é mais "nova"
}
================================*/

const STORAGE_KEY = 'personal_jp_dict_v1';
let db = loadDB();

function uid() {
  return 'id-' + Math.random().toString(36).slice(2,10);
}

function loadDB(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch(e) { console.error(e); return []; }
}

function saveDB(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
}

function addWord(){
  const w = document.getElementById('word').value.trim();
  const reading = document.getElementById('reading').value.trim();
  const translation = document.getElementById('translation').value.trim();
  const level = document.getElementById('level').value;
  const tags = (document.getElementById('tags').value || '').split(',').map(s=>s.trim()).filter(Boolean);
  const notes = document.getElementById('notes').value.trim();

  if(!w || !translation) { alert('Palavra e tradução são obrigatórias.'); return; }

  const entry = {
    id: uid(),
    word: w,
    reading,
    translation,
    level,
    tags,
    notes,
    createdAt: Date.now(),
    seen: false // novo: será mostrado com ✨
  };
  db.unshift(entry);
  saveDB();
  renderList();
  clearForm();
}

function clearForm(){
  ['word','reading','translation','level','tags','notes'].forEach(id => document.getElementById(id).value = '');
}

function renderList(){
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  list.innerHTML = '';
  const q = (document.getElementById('q').value || '').toLowerCase();
  const filterLevel = document.getElementById('filterLevel').value;
  const sortBy = document.getElementById('sortBy').value;

  let items = db.slice();

  if(q){
    items = items.filter(e =>
      e.word.toLowerCase().includes(q) ||
      (e.reading || '').toLowerCase().includes(q) ||
      (e.translation || '').toLowerCase().includes(q) ||
      (e.tags || []).join(' ').toLowerCase().includes(q) ||
      (e.notes || '').toLowerCase().includes(q)
    );
  }
  if(filterLevel) items = items.filter(e => e.level === filterLevel);

  // sorting
  items.sort((a,b)=>{
    if(sortBy === 'createdDesc') return b.createdAt - a.createdAt;
    if(sortBy === 'createdAsc') return a.createdAt - b.createdAt;
    if(sortBy === 'wordAsc') return a.word.localeCompare(b.word, 'ja-u-co-unihan') ;
    if(sortBy === 'wordDesc') return b.word.localeCompare(a.word, 'ja-u-co-unihan') ;
    return 0;
  });

  if(items.length === 0){
    empty.hidden = false;
    return;
  }
  empty.hidden = true;

  items.forEach(e => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="left">
        <div>
          <div class="word">${escapeHtml(e.word)} ${e.level ? `<span class="level">${e.level}</span>`: ''} ${!e.seen ? '<span class="newBadge">✨</span>' : ''}</div>
          <div class="reading">${escapeHtml(e.reading || '')}</div>
          <div class="meta">${escapeHtml(e.translation)} ${e.tags && e.tags.length ? ' · ' + e.tags.map(t=>escapeHtml(t)).join(', ') : ''}</div>
        </div>
      </div>
      <div class="actions">
        <button onclick="showEdit('${e.id}')">Editar</button>
        <button onclick="toggleSeen('${e.id}')">${e.seen ? 'Marcar nova' : 'Marcar lida'}</button>
        <button onclick="deleteEntry('${e.id}')">Excluir</button>
      </div>
    `;
    list.appendChild(card);
  });
}

function escapeHtml(s){ if(!s) return ''; return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c])); }

function showEdit(id){
  const e = db.find(x=>x.id===id);
  if(!e) return;
  // preencher o formulário com a entrada e removê-la temporariamente (ou atualizar diretamente)
  document.getElementById('word').value = e.word;
  document.getElementById('reading').value = e.reading;
  document.getElementById('translation').value = e.translation;
  document.getElementById('level').value = e.level;
  document.getElementById('tags').value = e.tags.join(', ');
  document.getElementById('notes').value = e.notes;
  // remove entry to avoid duplicate on submit; instead we'll add with same id when saving
  db = db.filter(x=>x.id!==id);
  saveDB();
  renderList();
  // Scroll to form
  window.scrollTo({top:0,behavior:'smooth'});
}

function toggleSeen(id){
  const e = db.find(x=>x.id===id);
  if(!e) return;
  e.seen = !e.seen;
  saveDB();
  renderList();
}

function deleteEntry(id){
  if(!confirm('Deseja excluir esta palavra?')) return;
  db = db.filter(x=>x.id!==id);
  saveDB();
  renderList();
}

function confirmClearDB(){
  if(confirm('Apagar todo o dicionário? Esta ação não pode ser desfeita.')) {
    db = [];
    saveDB();
    renderList();
  }
}

function exportJSON(){
  const dataStr = JSON.stringify(db, null, 2);
  const blob = new Blob([dataStr], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'my_jp_dictionary.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importJSON(e){
  const f = e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const arr = JSON.parse(reader.result);
      if(!Array.isArray(arr)) throw new Error('Formato inválido');
      // opcional: deduplicação por palavra+translation
      const existingKeys = new Set(db.map(x=>x.word + '||' + x.translation));
      arr.forEach(item => {
        if(!item.id) item.id = uid();
        if(!existingKeys.has(item.word + '||' + item.translation)) {
          // keep imported entries as 'new' by default (seen = false)
          item.seen = item.seen === true;
          db.push(item);
        }
      });
      saveDB();
      renderList();
      alert('Importado com sucesso.');
    } catch(err){
      alert('Erro ao importar JSON: ' + err.message);
    }
  };
  reader.readAsText(f);
  // limpar input
  e.target.value = '';
}

/* ====== Extensão possível: buscar nível JLPT automaticamente ======
  COMENTÁRIOS:
  - Para buscar nível JLPT de um site (ex: japandict.com) automaticamente você precisa:
    1) de uma API pública do site (ideal);
    2) ou de um serviço que permita CORS, pois fetch() do navegador sofre restrição.
    3) se o site não fornecer API, será necessário um servidor/proxy que faça a requisição e exponha uma rota segura.
  - Abaixo há um placeholder de função que você pode adaptar quando tiver uma API/proxy disponível.
*/

async function fetchJLPTFromApi(word){
  // EXEMPLO (placeholder): substitua a URL pela sua API/proxy que retorna { level: "N5" } etc.
  // CUIDADO: o navegador bloqueará requisições a domínios que não permitirem CORS sem proxy.
  try {
    const resp = await fetch('https://sua-api-proxy.exemplo/japandict/lookup?word=' + encodeURIComponent(word));
    if(!resp.ok) throw new Error('Resposta não-ok');
    const data = await resp.json();
    return data.level || '';
  } catch(err){
    console.warn('Não foi possível obter JLPT automaticamente:', err.message);
    return '';
  }
}

/* ========== Inicialização ========== */
renderList();

/* Observação: se você quiser que, ao adicionar, haja tentativa automática de preencher 'level' via API,
   chame fetchJLPTFromApi(word) dentro de addWord() antes de salvar. Lembre-se de tratar CORS. */
</script>
</body>
</html>
